# Copy to /etc/company-deploy/compose/satellital-capture.yaml on the server (root:root, 644).
# setup-server.sh replaces 3002 below with the first free port it finds.
name: satellital-capture
services:
  satellital-capture:
    image: ${SATELLITAL_CAPTURE_IMAGE:?El controlador debe proporcionar la imagen}
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - '127.0.0.1:3002:8080'
    healthcheck:
      test: ['CMD', 'python3', '-c', 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=4).status == 200 else 1)']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
